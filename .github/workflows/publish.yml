name: Publish to PyPI

# Builds a single universal wheel + sdist for the pure-Python `creversi`
# package and uploads it to PyPI when a GitHub Release is published.
#
# Authentication uses PyPI Trusted Publishing (OIDC) — no API tokens or
# passwords are stored as repository secrets. To enable it once:
#   1. Create the project on PyPI (or reserve the name with a manual upload).
#   2. On https://pypi.org/manage/account/publishing/ add a "pending" or
#      existing publisher with:
#        owner:       jhchundev
#        repository:  creversi
#        workflow:    publish.yml
#        environment: pypi
#   3. In this repo, create a GitHub Environment named `pypi`
#      (Settings -> Environments -> New environment).
#
# To cut a release: bump `version` in pyproject.toml, tag (e.g. v0.1.1),
# and publish a GitHub Release pointing at that tag.
#
# Fallback (API token) — if you prefer not to use Trusted Publishing,
# delete the `permissions:` and `environment:` blocks and replace the
# `pypa/gh-action-pypi-publish` step's inputs with:
#     password: ${{ secrets.PYPI_API_TOKEN }}
# after adding a PYPI_API_TOKEN repository secret.

on:
  release:
    types: [published]
  workflow_dispatch:  # allow manual runs for testing

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
