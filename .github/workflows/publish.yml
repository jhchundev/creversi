name: Publish to PyPI

# Builds a single universal wheel + sdist for the pure-Python
# `creversi-python` package and uploads it to PyPI when a release tag is
# pushed.
#
# Trigger: pushing a tag like `v0.1.0`, `v1.2.3`, etc. Pre-release tags
# (e.g. `v0.1.0-rc1`) are intentionally ignored — those are handled by
# `publish-testpypi.yml`.
#
# Authentication uses PyPI Trusted Publishing (OIDC) — no API tokens or
# passwords are stored as repository secrets. To enable it once:
#   1. Create the project on PyPI (`creversi-python`) or reserve the name
#      via a manual upload / pending publisher.
#   2. On https://pypi.org/manage/account/publishing/ add a publisher with:
#        owner:       jhchundev
#        repository:  creversi
#        workflow:    publish.yml
#        environment: pypi
#   3. In this repo, create a GitHub Environment named `pypi`
#      (Settings -> Environments -> New environment).
#
# To cut a release, just push a tag — the version is derived from the
# tag itself by setuptools_scm (no source-file edits needed):
#     git tag v0.1.2
#     git push origin v0.1.2
#
# Fallback (API token) — if you prefer not to use Trusted Publishing,
# delete the `permissions:` and `environment:` blocks and replace the
# `pypa/gh-action-pypi-publish` step's inputs with:
#     password: ${{ secrets.PYPI_API_TOKEN }}
# after adding a PYPI_API_TOKEN repository secret.

on:
  push:
    tags:
      - 'v*'
      - '!v*-*'

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags so setuptools_scm can derive the version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
