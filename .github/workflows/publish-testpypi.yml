name: Publish to TestPyPI

# Publishes a pre-release build to https://test.pypi.org so you can
# validate it before cutting a stable release.
#
# Trigger: pushing a pre-release tag like `v0.1.0-rc1`, `v0.2.0-test1`,
# `v1.0.0-beta3`, etc. (anything matching `v*-*`). Stable tags such as
# `v0.1.0` are handled by `publish.yml` and ignored here.
#
# Uses Trusted Publishing — register a publisher at
# https://test.pypi.org/manage/account/publishing/ with:
#   owner:       jhchundev
#   repository:  creversi
#   workflow:    publish-testpypi.yml
#   environment: testpypi
# and create a `testpypi` GitHub Environment in this repo.
#
# Install a published test build with:
#   pip install --index-url https://test.pypi.org/simple/ \
#               --extra-index-url https://pypi.org/simple/ creversi-python
#
# To cut a pre-release:
#     git tag v0.1.1-rc1
#     git push origin v0.1.1-rc1

on:
  push:
    tags:
      - 'v*-*'

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
