[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creversi-python"
dynamic = ["version"]
description = "Fast pure-Python Reversi/Othello library"
readme = "README.rst"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.8"
dependencies = ["numpy>=1.20"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.optional-dependencies]
fast = ["numba>=0.55"]
gym = ["gym"]
test = ["pytest"]

[tool.setuptools.packages.find]
exclude = ["tests*", "legacy_cpp*", "legacy_test_cpp*"]

# Derive the package version from the most recent git tag matching `v*`.
# Push a tag like `v0.1.2` and the build will produce
# `creversi_python-0.1.2.*`. No version literal lives in any source file,
# so the wheel and the tag can never disagree.
[tool.setuptools_scm]
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:[-.].+)?)$'
fallback_version = "0.0.0"
